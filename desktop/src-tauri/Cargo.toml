[package]
name = "nect-svg-desktop"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
serde_json = "1"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.9.0", features = [] }
rfd = { version = "0.15", features = ["common-controls-v6"] }
tempfile = "3"
[features]
custom-protocol = ["tauri/custom-protocol"]
recovery-acceptance-test = []

