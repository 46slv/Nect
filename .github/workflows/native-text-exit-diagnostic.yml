name: Diagnose native Text exit

on:
  push:
    branches: [diagnostic/native-text-exit-20261022]

permissions:
  contents: read

jobs:
  windows-text-exit:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare reviewed Boost headers
        run: |
          New-Item -ItemType Directory -Force build-core/evidence | Out-Null
          $deps = Join-Path $env:RUNNER_TEMP 'nect-core-deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          $archive = Join-Path $deps 'boost_1_83_0.zip'
          Invoke-WebRequest 'https://archives.boost.io/release/1.83.0/source/boost_1_83_0.zip' -OutFile $archive
          # https://archives.boost.io/release/1.83.0/source/boost_1_83_0.zip.json
          $expected = 'c86bd9d9eef795b4b0d3802279419fde5221922805b073b9bd822edecb1ca28e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'Official Boost archive SHA256 mismatch'
          }
          7z x $archive "-o$deps" 'boost_1_83_0/boost/*' -r -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headers = Join-Path $deps 'boost_1_83_0'
          if (-not (Test-Path -LiteralPath (Join-Path $headers 'boost/json/src.hpp') -PathType Leaf)) {
            throw 'Boost.JSON source headers are missing'
          }
          "NECT_BOOST_INCLUDE_DIR=$headers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision reviewed Japanese text capability
        timeout-minutes: 10
        run: ./desktop/scripts/prepare-windows-japanese-fonts.ps1 -InstallIfMissing -EvidenceDirectory build-core/evidence

      - name: Configure unchanged Debug test
        run: |
          cmake -S . -B build-core -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON -DNECT_DESKTOP=OFF "-DBOOST_INCLUDE_DIR=$env:NECT_BOOST_INCLUDE_DIR" 2>&1 | Tee-Object -FilePath build-core/evidence/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build only Text authoring test and dependencies
        id: build
        run: |
          cmake --build build-core --config Debug --target text_authoring_tests --parallel 2 2>&1 | Tee-Object -FilePath build-core/evidence/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact Text executable once and record native exit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path 'build-core/Debug/text_authoring_tests.exe').Path
          $directory = (Resolve-Path 'build-core').Path
          $evidence = (Resolve-Path 'build-core/evidence').Path
          $stdout = Join-Path $evidence 'text-authoring.stdout.log'
          $stderr = Join-Path $evidence 'text-authoring.stderr.log'
          $process = Start-Process -FilePath $exe -WorkingDirectory $directory -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $exitCode = $process.ExitCode
          if ($null -eq $exitCode -or -not $process.HasExited) { throw 'Native process exit status is unavailable' }
          $signed = [int]$exitCode
          $hex = '{0:X8}' -f ([long]$signed -band 4294967295L)
          [ordered]@{
            commit = $env:GITHUB_SHA
            sourceBase = '015cd32221b58f9a79c1d1e8d3b27ba5df579bdc'
            executable = 'build-core/Debug/text_authoring_tests.exe'
            executableSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            testSourceSha256 = (Get-FileHash -LiteralPath 'tests/text_authoring_tests.cpp' -Algorithm SHA256).Hash.ToLowerInvariant()
            exitCodeSigned = $signed
            exitCodeHex = $hex
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'text-authoring-exit.json') -Encoding utf8
          Write-Host "Text authoring native exit: signed=$signed hex=$hex"
          if ($signed -ne 0) { exit $signed }

      - name: Bound text evidence without hiding truncation
        if: always()
        run: |
          New-Item -ItemType Directory -Force build-core/evidence | Out-Null
          $limit = 2MB
          $manifest = @()
          foreach ($file in Get-ChildItem -LiteralPath build-core/evidence -File | Where-Object { $_.Extension -in '.log', '.json' }) {
            $original = $file.Length
            if ($original -gt $limit) {
              $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($file.FullName))
              try { $prefix = $reader.ReadBytes($limit) } finally { $reader.Dispose() }
              [IO.File]::WriteAllBytes($file.FullName, $prefix)
            }
            $manifest += [ordered]@{ name = $file.Name; originalBytes = $original; retainedBytes = [Math]::Min($original, $limit); truncated = ($original -gt $limit) }
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath build-core/evidence/artifact-manifest.json -Encoding utf8

      - name: Preserve bounded text diagnostics only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nect-native-text-exit-${{ github.sha }}
          path: |
            build-core/evidence/*.json
            build-core/evidence/*.log
          if-no-files-found: ignore
          retention-days: 1
