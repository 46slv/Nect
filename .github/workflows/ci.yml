name: ci

on:
  push:
    branches: ["main", "bootstrap/**"]
  pull_request:
    branches: ["main"]

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-json1.83-dev python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Contract tests
        run: ctest --test-dir build --output-on-failure

      - name: Real-process smoke
        run: python3 scripts/smoke.py --exe build/nect
